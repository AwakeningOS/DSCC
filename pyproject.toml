[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dscc-desktop"
version = "0.1.0a1"
description = "Local-first DSCC research, Open Model Commons and MCP foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yusuke Maeda"}]
dependencies = ["cryptography>=46.0.4,<47"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5"]

[project.scripts]
dscc = "dscc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
